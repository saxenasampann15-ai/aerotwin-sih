services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - aerotwin-data:/app/backend/data
      - aerotwin-models:/app/backend/models
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  aerotwin-data:
  aerotwin-models:
